name: Bug report
description: Report a reproducible application problem.
body:
  - type: markdown
    attributes:
      value: Do not include passwords, session cookies, user data or account databases. Report security vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Application version, OS, Node/browser versions, filesystem type and relevant configuration with secrets removed.
    validations:
      required: true
