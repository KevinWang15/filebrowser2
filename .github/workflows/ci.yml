name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare mounted-filesystem fixture
        run: |
          mkdir -p "${RUNNER_TEMP}/filebrowser-files/external"
          sudo mount -t tmpfs -o size=64m,mode=0777 tmpfs "${RUNNER_TEMP}/filebrowser-files/external"
      - run: npm run check
        env:
          FB_TEST_STORAGE_ROOT: ${{ runner.temp }}/filebrowser-files
          FB_TEST_MOUNT_PATH: ${{ runner.temp }}/filebrowser-files/external
      - name: Remove mounted fixture
        if: always()
        run: sudo umount "${RUNNER_TEMP}/filebrowser-files/external" || true
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check browser workflow
        run: npx playwright test
  shares:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Build optional SMB containers
        run: docker compose -p filebrowser-smb-verify -f compose.verify.yml -f compose.verify.smb.yml build app smb smb-client
      - name: Start isolated protocol services
        run: |
          mkdir -p verification
          docker compose -p filebrowser-smb-verify -f compose.verify.yml -f compose.verify.smb.yml up -d --no-build app smb
      - name: Verify native SMB access and revocation
        run: docker compose -p filebrowser-smb-verify -f compose.verify.yml -f compose.verify.smb.yml run --rm smb-client
      - name: Verify restart, leases, delayed policies and control failures
        run: FB_VERIFY_PROJECT=filebrowser-smb-verify node scripts/verify-container-shares-recovery.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smb-verification
          path: verification/*results.json
      - name: Remove isolated protocol fixtures
        if: always()
        run: docker compose -p filebrowser-smb-verify -f compose.verify.yml -f compose.verify.smb.yml down -v
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Build native storage fixtures and browser runner
        run: docker compose -p filebrowser-targets-verify -f compose.targets.verify.yml build
      - name: Start MinIO, FTP, FTPS and OpenSSH
        run: |
          mkdir -p verification/targets
          docker compose -p filebrowser-targets-verify -f compose.targets.verify.yml up -d --wait --no-build minio remotes
      - name: Verify remote uploads, fault recovery and multi-target browser workflow
        run: node scripts/verify-remote-containers.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: storage-target-verification
          path: verification/targets/
      - name: Remove isolated target fixtures
        if: always()
        run: docker compose -p filebrowser-targets-verify -f compose.targets.verify.yml down -v
  container:
    needs: [check, shares, storage]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-docker-image.yml
