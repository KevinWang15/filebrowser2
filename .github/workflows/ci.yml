name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: starter_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d starter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare mounted-filesystem fixture
        run: |
          mkdir -p "${RUNNER_TEMP}/filebrowser-files/external"
          sudo mount -t tmpfs -o size=64m,mode=0777 tmpfs "${RUNNER_TEMP}/filebrowser-files/external"
      - run: npm run check
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:${{ job.services.postgres.ports[5432] }}/starter_test
          FB_TEST_STORAGE_ROOT: ${{ runner.temp }}/filebrowser-files
          FB_TEST_MOUNT_PATH: ${{ runner.temp }}/filebrowser-files/external
      - name: Remove mounted fixture
        if: always()
        run: sudo umount "${RUNNER_TEMP}/filebrowser-files/external" || true
