name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare mounted-filesystem fixture
        run: |
          mkdir -p "${RUNNER_TEMP}/filebrowser-files/external"
          sudo mount -t tmpfs -o size=64m,mode=0777 tmpfs "${RUNNER_TEMP}/filebrowser-files/external"
      - run: npm run check
        env:
          FB_TEST_STORAGE_ROOT: ${{ runner.temp }}/filebrowser-files
          FB_TEST_MOUNT_PATH: ${{ runner.temp }}/filebrowser-files/external
      - name: Remove mounted fixture
        if: always()
        run: sudo umount "${RUNNER_TEMP}/filebrowser-files/external" || true
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Check browser workflow
        run: npx playwright test
  shares:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Build optional SMB containers
        run: docker compose -p filebrowser-smb-verify -f compose.verify.yml -f compose.verify.smb.yml build app smb smb-client
      - name: Start isolated protocol services
        run: |
          mkdir -p verification
          docker compose -p filebrowser-smb-verify -f compose.verify.yml -f compose.verify.smb.yml up -d --no-build app smb
      - name: Verify native SMB access and revocation
        run: docker compose -p filebrowser-smb-verify -f compose.verify.yml -f compose.verify.smb.yml run --rm smb-client
      - name: Verify restart, leases, delayed policies and control failures
        run: FB_VERIFY_PROJECT=filebrowser-smb-verify node scripts/verify-container-shares-recovery.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smb-verification
          path: verification/*results.json
      - name: Remove isolated protocol fixtures
        if: always()
        run: docker compose -p filebrowser-smb-verify -f compose.verify.yml -f compose.verify.smb.yml down -v
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Build native storage fixtures and browser runner
        run: docker compose -p filebrowser-targets-verify -f compose.targets.verify.yml build
      - name: Start MinIO, FTP, FTPS and OpenSSH
        run: |
          mkdir -p verification/targets
          docker compose -p filebrowser-targets-verify -f compose.targets.verify.yml up -d --wait --no-build minio remotes
      - name: Verify remote uploads, fault recovery and multi-target browser workflow
        run: node scripts/verify-remote-containers.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: storage-target-verification
          path: verification/targets/
      - name: Remove isolated target fixtures
        if: always()
        run: docker compose -p filebrowser-targets-verify -f compose.targets.verify.yml down -v
  container:
    needs: [check, shares, storage]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Container name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: FB_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify both runtime architectures
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            image_arch=${platform#linux/}
            platform_digest=$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" | jq -er --arg arch "$image_arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')
            echo "Checking $platform ($platform_digest)"
            container_id=$(docker run -d --platform "$platform" "${IMAGE}@${platform_digest}")
            trap 'docker rm -f "$container_id"' EXIT
            ready=false
            for attempt in {1..30}; do
              if docker exec "$container_id" node -e "fetch('http://127.0.0.1:3000/health').then(async r=>{const h=await r.json();process.exit(r.ok&&h.commit===process.argv[1]?0:1)}).catch(()=>process.exit(1))" "$GITHUB_SHA"; then
                ready=true
                break
              fi
              sleep 1
            done
            if [ "$ready" != true ]; then
              docker logs "$container_id"
              exit 1
            fi
            docker rm -f "$container_id"
            trap - EXIT
          done
      - uses: sigstore/cosign-installer@v4.1.0
        if: github.event_name != 'pull_request'
      - name: Sign container digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Verify container signature
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/ci.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"
