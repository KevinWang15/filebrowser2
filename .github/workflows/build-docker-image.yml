name: Build Docker Image

# CI calls this only after the application, SMB and remote-storage checks pass.
on:
  workflow_call:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Container name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: FB_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify both runtime architectures
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            image_arch=${platform#linux/}
            platform_digest=$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" | jq -er --arg arch "$image_arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest')
            echo "Checking $platform ($platform_digest)"
            docker run --rm --platform "$platform" --entrypoint sh "${IMAGE}@${platform_digest}" -ec '
              for binary in node smbd testparm getent useradd groupadd usermod; do
                command -v "$binary"
              done
              smbd --version
              testparm --version
              test -s /etc/ssl/certs/ca-certificates.crt
              test -s /app/dist/server/samba-agent.js
              node --input-type=module -e "import { DatabaseSync } from \"node:sqlite\"; const db = new DatabaseSync(\":memory:\"); db.close();"
            '
            container_id=$(docker run -d --platform "$platform" "${IMAGE}@${platform_digest}")
            trap 'docker rm -f "$container_id"' EXIT
            ready=false
            for attempt in {1..30}; do
              if docker exec "$container_id" node -e "fetch('http://127.0.0.1:3000/health').then(async r=>{const h=await r.json();process.exit(r.ok&&h.commit===process.argv[1]?0:1)}).catch(()=>process.exit(1))" "$GITHUB_SHA"; then
                ready=true
                break
              fi
              sleep 1
            done
            if [ "$ready" != true ]; then
              docker logs "$container_id"
              exit 1
            fi
            docker rm -f "$container_id"
            trap - EXIT
          done
      - uses: sigstore/cosign-installer@v4.1.0
        if: github.event_name != 'pull_request'
      - name: Sign container digest
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Verify container signature
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/build-docker-image.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"
