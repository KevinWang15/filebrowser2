services:
  app:
    build:
      context: .
      target: runtime
    environment:
      FB_UPLOAD_CHUNK_SIZE: "102400"
      FB_LOG_LEVEL: "warn"
    volumes:
      - verify-files:/files
      - verify-state:/state
    ports:
      - "127.0.0.1:3320:3000"
    networks:
      default:
        aliases:
          - filebrowser.internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
  readonly:
    build:
      context: .
      target: runtime
    environment:
      FB_UPLOAD_CHUNK_SIZE: "102400"
      FB_LOG_LEVEL: "warn"
    volumes:
      - verify-files:/files:ro
    tmpfs:
      - /state:size=32m,uid=1000,gid=1000,mode=0700
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
  diskfull:
    build:
      context: .
      target: runtime
    environment:
      FB_UPLOAD_CHUNK_SIZE: "102400"
      FB_LOG_LEVEL: "warn"
    tmpfs:
      - /files:size=32m,uid=1000,gid=1000,mode=0750
      - /state:size=16m,uid=1000,gid=1000,mode=0700
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
  runner:
    build:
      context: .
      target: verification
    init: true
    shm_size: 1gb
    environment:
      FB_VERIFY_URL: http://filebrowser.internal:3000
      FB_VERIFY_OUTPUT: /evidence
      FB_TEST_STORAGE_ROOT: /files
      FB_TEST_MOUNT_PATH: /files/external
    tmpfs:
      - /files/external:size=64m,mode=0750
    volumes:
      - ./verification:/evidence
      - ./scripts:/app/scripts:ro
      - ./tests:/app/tests:ro
      - verify-files:/verify-files:ro
      - verify-state:/verify-state:ro
    depends_on:
      app:
        condition: service_healthy
      diskfull:
        condition: service_healthy

volumes:
  verify-files:
  verify-state:
