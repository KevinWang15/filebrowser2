listen=YES
listen_ipv6=NO
listen_port=2122
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_root=/srv/remote
chroot_local_user=YES
allow_writeable_chroot=YES
pam_service_name=vsftpd
secure_chroot_dir=/var/run/vsftpd/empty
pasv_min_port=30200
pasv_max_port=30249
ssl_enable=YES
rsa_cert_file=/tmp/ftp.crt
rsa_private_key_file=/tmp/ftp.key
force_local_logins_ssl=YES
force_local_data_ssl=YES
require_ssl_reuse=YES
ssl_sslv2=NO
ssl_sslv3=NO
utf8_filesystem=YES
