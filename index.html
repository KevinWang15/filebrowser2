<!doctype html>
<html lang="en" data-density="compact">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="A private file workspace with scoped access and reliable resumable uploads." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='24' y2='24' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%2314b8a6'/%3E%3Cstop offset='1' stop-color='%230e7490'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6.5' fill='url(%23g)'/%3E%3Cpath d='M6 8.6c0-.9.7-1.6 1.6-1.6h2.6c.4 0 .8.2 1.1.5l1 1h4.1c.9 0 1.6.7 1.6 1.6v5.3c0 .9-.7 1.6-1.6 1.6H7.6c-.9 0-1.6-.7-1.6-1.6z' fill='%23fff'/%3E%3C/svg%3E" />
    <title>Filebrowser</title>
    <script>
      // Apply saved appearance before first paint to avoid a theme flash.
      try {
        var theme = localStorage.getItem('fb-theme'), density = localStorage.getItem('fb-density')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
        if (density === 'comfortable') document.documentElement.dataset.density = density
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/frontend/main.tsx"></script>
  </body>
</html>
