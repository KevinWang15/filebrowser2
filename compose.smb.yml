services:
  filebrowser:
    build:
      target: runtime
    environment:
      FB_SMB_ENABLED: "true"
      FB_SMB_CONTROL_DIR: /state/protocols
      FB_SMB_PUBLIC_HOST: "${FB_SMB_PUBLIC_HOST:-}"
    volumes:
      - protocol-control:/state/protocols
  smb:
    image: ${FB_IMAGE:-ghcr.io/kevinwang15/filebrowser2:latest}
    build:
      context: .
      target: runtime
    user: "0:0"
    command: ["node", "dist/server/samba-agent.js"]
    init: true
    restart: unless-stopped
    environment:
      FB_SMB_CONTROL_DIR: /control
      FB_SMB_ALLOWED_ROOTS: '["/files"]'
      FB_SMB_STATE_DIR: /samba-state
    ports:
      - "${FB_SMB_BIND_ADDRESS:-127.0.0.1}:${FB_SMB_PUBLIC_PORT:-445}:445"
    volumes:
      - files:/files:ro
      - protocol-control:/control
      - samba-state:/samba-state
    healthcheck:
      test: ["CMD", "node", "dist/server/samba-agent.js", "--health"]
      interval: 5s
      timeout: 3s
      retries: 5
    stop_grace_period: 10s

volumes:
  protocol-control:
  samba-state:
